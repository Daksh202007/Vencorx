name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 200.234.41.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/root/ai-tradesignal"
          # Exclude heavy folders to speed up transfer; they will be built/installed inside Docker on the VPS
          exclude: |
            **/node_modules/**
            **/.next/**
            **/.git/**
            **/dist/**

      - name: Run Deploy Command on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.234.41.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to the deployment directory
            cd /root/ai-tradesignal/deployment
            
            # Rebuild and restart the Docker stack
            docker compose down
            docker compose up --build -d
