name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 200.234.41.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/root/ai-tradesignal"
          # Exclude heavy folders to speed up transfer; they will be built/installed inside Docker on the VPS
          exclude: |
            **/node_modules/**
            **/.next/**
            **/.git/**
            **/dist/**

      - name: Run Deploy Command on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: 200.234.41.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_FILE
          script: |
            # Navigate to the deployment directory
            cd /root/ai-tradesignal/deployment
            
            # Write the ENV_FILE secret securely to the .env file
            echo "$ENV_FILE" > .env

            # Export git metadata so docker-compose can pass them as build args
            export GIT_COMMIT=$(git -C /root/ai-tradesignal rev-parse HEAD 2>/dev/null || echo 'unknown')
            export GIT_BRANCH=$(git -C /root/ai-tradesignal rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'unknown')
            export GIT_TAG=$(git -C /root/ai-tradesignal describe --tags --always --dirty 2>/dev/null || echo 'no-tag')
            export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "Building commit: $GIT_COMMIT  branch: $GIT_BRANCH  tag: $GIT_TAG"
            
            # Rebuild and restart the Docker stack
            docker compose down
            docker compose up --build -d
