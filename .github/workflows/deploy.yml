name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Capture git metadata HERE in the Actions runner (where .git IS available).
      # .git is excluded from SCP, so we must read it before copying files to VPS.
      - name: Capture Git Metadata
        id: git_meta
        run: |
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "tag=$(git describe --tags --always --dirty 2>/dev/null || echo no-tag)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Copy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 200.234.41.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/root/ai-tradesignal"
          # Exclude heavy folders to speed up transfer
          exclude: |
            **/node_modules/**
            **/.next/**
            **/.git/**
            **/dist/**

      - name: Run Deploy Command on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GIT_COMMIT: ${{ steps.git_meta.outputs.commit }}
          GIT_BRANCH: ${{ steps.git_meta.outputs.branch }}
          GIT_TAG: ${{ steps.git_meta.outputs.tag }}
          BUILD_TIME: ${{ steps.git_meta.outputs.build_time }}
        with:
          host: 200.234.41.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_FILE,GIT_COMMIT,GIT_BRANCH,GIT_TAG,BUILD_TIME
          script: |
            printf '%s' "$ENV_FILE" > /root/ai-tradesignal/.env
            cd /root/ai-tradesignal/deployment
            echo "Building commit: $GIT_COMMIT  branch: $GIT_BRANCH  tag: $GIT_TAG  time: $BUILD_TIME"
            docker compose down
            docker compose up --build -d
