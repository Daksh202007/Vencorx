version: '3.8'

services:
  # TimescaleDB (PostgreSQL with Time-Series extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ai_tradesignal_timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timescaledb
    ports:
      - '5432:5432'
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: always

  # pgAdmin (Web-based Administration Dashboard for TimescaleDB)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai_tradesignal_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tradesignal.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - timescaledb
    restart: always

  # Zookeeper (Required for Confluent Kafka coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ai_tradesignal_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always
    ports:
      - '2181:2181'

  # Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ai_tradesignal_kafka
    depends_on:
      - zookeeper
    restart: always
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

volumes:
  timescale_data:
